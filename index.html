<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <header id="header">
        <div class="header-container">
            <div class="header-brand">
                <span class="header-icon">💸</span>
                <div>
                    <h1>Expense Tracker</h1>
                    <p class="header-subtitle">Monitor and manage your daily spending</p>
                </div>
            </div>
        </div>
    </header>

    <main class="app-container">
        <div id="upper-half">
            <section id="Summary" class="card">
                <div class="card-header">
                    <h2>Summary</h2>
                    <span class="card-tag">Overview</span>
                </div>
                <div class="summary-cards">
                    <div class="metric-card spent">
                        <div class="metric-icon-wrap">💰</div>
                        <div class="metric-data">
                            <span class="metric-label">Total Outflow</span>
                            <p id="total-spent">Total Spent: ₹0.00</p>
                        </div>
                    </div>
                    <div class="metric-card count">
                        <div class="metric-icon-wrap">📊</div>
                        <div class="metric-data">
                            <span class="metric-label">Transactions</span>
                            <p id="num-exp">Number of Expenses: 0</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="expense-form" class="card">
                <div class="card-header">
                    <h2>Add Expense</h2>
                    <span class="card-tag">New Record</span>
                </div>
                <form id="exp-form" action="">
                    <div class="form-group">
                        <label for="expense-name">Expense Name</label>
                        <input type="text" id="expense-name" name="expense-name" placeholder="e.g. Groceries, Coffee, Rent" required>
                    </div>

                    <div class="form-group">
                        <label for="expense-amount">Amount (₹)</label>
                        <input type="number" id="expense-amount" name="expense-amount" step="0.01" min="0" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select name="category" id="category">
                            <option value="food">🍔 Food</option>
                            <option value="transportation">🚗 Transportation</option>
                            <option value="entertainment">🎬 Entertainment</option>
                            <option value="utilities">⚡ Utilities</option>
                            <option value="other">📦 Other</option>
                        </select>
                    </div>

                    <button type="submit" id="add-expense-btn">Add Expense</button>
                </form>
            </section>
        </div>

        <section id="transaction-history" class="card">
            <div class="card-header">
                <h2>Transaction History</h2>
                <!-- <span class="hint-text">Double-click "Delete" to remove</span> -->
            </div>
            <ul id="transaction-list">
                <!-- Transactions will be added here dynamically -->
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
